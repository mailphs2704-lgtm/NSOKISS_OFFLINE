name: Offline server build

on:
  push:
    branches:
      - main
      - offline-conversion
  pull_request:
    branches:
      - main
      - offline-conversion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
