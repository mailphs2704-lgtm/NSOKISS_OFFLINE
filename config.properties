# NSOKISS OFFLINE - local server configuration
# Database settings are aligned with the supplied MariaDB SQL dump.
server.log.display=true
server.id=1
server.port=14444

# Local MariaDB/MySQL database.
# The supplied SQL dump creates the database `nsotien_0`.
db.driver=com.mysql.cj.jdbc.Driver
db.host=127.0.0.1
db.port=3306
db.user=root
db.password=
db.dbname=nsotien_0
db.maxconnections=20
db.minconnections=5

# MongoDB is retained on localhost only for legacy subsystems that still use it.
mongodb.host=127.0.0.1
mongodb.port=27017
mongodb.user=
mongodb.password=
mongodb.dbname=nsotien_0

# Local game/websocket endpoints.
websocket.host=127.0.0.1
websocket.port=8080

