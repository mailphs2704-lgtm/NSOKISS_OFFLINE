# NSOKISS OFFLINE - local server configuration
# The server runs on this PC. Keep these values local; do not point them to a remote server.
server.log.display=true
server.id=1
server.port=14444

# Local MySQL database (the game database must be installed on this PC).
db.driver=com.mysql.cj.jdbc.Driver
db.host=127.0.0.1
db.port=3306
db.user=root
db.password=
db.dbname=nso
db.maxconnections=20
db.minconnections=5

# MongoDB is kept local for legacy subsystems.
mongodb.host=127.0.0.1
mongodb.port=27017
mongodb.user=
mongodb.password=
mongodb.dbname=nso

# Socket.IO/local websocket settings.
websocket.host=127.0.0.1
websocket.port=8080

